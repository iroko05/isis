<svg xmlns="http://www.w3.org/2000/svg" width="1300" height="320" viewBox="0 0 1300 320">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#333"/>
    </marker>
    <style>
      .task { fill: #f8f9fa; stroke: #333; stroke-width: 2; }
      .gateway { fill: #fff3cd; stroke: #333; stroke-width: 2; }
      .event { fill: #fff; stroke: #333; stroke-width: 3; }
      .flow { stroke: #333; stroke-width: 2; fill: none; marker-end: url(#arrow); }
      .label { font-family: Arial, sans-serif; font-size: 12px; fill: #333; }
      .title { font-family: Arial, sans-serif; font-size: 14px; font-weight: bold; fill: #111; }
    </style>
  </defs>
  <rect width="100%" height="100%" fill="white"/>

  <!-- Потоки -->
  <path class="flow" d="M136,118 L180,118"/>
  <path class="flow" d="M320,118 L370,118"/>
  <path class="flow" d="M510,118 L560,118"/>
  <path class="flow" d="M610,118 L660,118"/>
  <path class="flow" d="M585,143 L585,200 L250,200 L250,158"/>
  <path class="flow" d="M800,118 L850,118"/>
  <path class="flow" d="M990,118 L1040,118"/>
  <path class="flow" d="M1090,118 L1140,118"/>
  <path class="flow" d="M1065,143 L1065,238 L1140,238"/>

  <!-- События -->
  <circle class="event" cx="118" cy="118" r="18"/>
  <text class="label" x="118" y="160" text-anchor="middle">Начало</text>

  <circle class="event" cx="1158" cy="118" r="18"/>
  <circle cx="1158" cy="118" r="14" fill="none" stroke="#333" stroke-width="2"/>
  <text class="label" x="1158" y="160" text-anchor="middle">Успешная регистрация</text>

  <circle class="event" cx="1158" cy="238" r="18"/>
  <circle cx="1158" cy="238" r="14" fill="none" stroke="#333" stroke-width="2"/>
  <text class="label" x="1158" y="280" text-anchor="middle">Не подтверждена</text>

  <!-- Задачи -->
  <rect class="task" x="180" y="78" width="140" height="80" rx="10"/>
  <text class="label" x="250" y="105" text-anchor="middle">Ввести данные</text>
  <text class="label" x="250" y="125" text-anchor="middle">(имя, email, пароль)</text>

  <rect class="task" x="370" y="78" width="140" height="80" rx="10"/>
  <text class="label" x="440" y="115" text-anchor="middle">Проверить</text>
  <text class="label" x="440" y="135" text-anchor="middle">корректность данных</text>

  <rect class="task" x="660" y="78" width="140" height="80" rx="10"/>
  <text class="label" x="730" y="105" text-anchor="middle">Отправить письмо</text>
  <text class="label" x="730" y="125" text-anchor="middle">для подтверждения</text>

  <rect class="task" x="850" y="78" width="140" height="80" rx="10"/>
  <text class="label" x="920" y="115" text-anchor="middle">Подтвердить</text>
  <text class="label" x="920" y="135" text-anchor="middle">регистрацию</text>

  <!-- Шлюзы -->
  <polygon class="gateway" points="585,93 610,118 585,143 560,118"/>
  <text class="label" x="585" y="80" text-anchor="middle">Данные корректны?</text>

  <polygon class="gateway" points="1065,93 1090,118 1065,143 1040,118"/>
  <text class="label" x="1065" y="80" text-anchor="middle">Подтверждено?</text>

  <!-- Подписи -->
  <text class="label" x="635" y="110" text-anchor="middle">Да</text>
  <text class="label" x="585" y="195" text-anchor="middle">Нет</text>
  <text class="label" x="1115" y="110" text-anchor="middle">Да</text>
  <text class="label" x="1065" y="195" text-anchor="middle">Нет</text>

  <text class="title" x="650" y="30" text-anchor="middle">BPMN: Регистрация пользователя на сайте</text>
</svg>
